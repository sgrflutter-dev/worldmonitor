<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data: https:;" />
    <title>Channel management - World Monitor</title>
    <script>(function(){try{var t=localStorage.getItem('worldmonitor-theme');if(t==='light')document.documentElement.dataset.theme='light';}catch(e){}document.documentElement.classList.add('no-transition');})()</script>
  </head>
  <body style="margin:0;background:var(--bg,#1a1c1e);color:var(--text,#e8eaed)">
    <!-- Good Thoughts shared product nav (stage/shell only; hidden unless :root[data-gt-shell]) -->
    <style>
      .gt-shell-nav{display:none}
      :root[data-gt-shell] .gt-shell-nav{display:block;position:fixed;top:0;left:0;right:0;z-index:100000;background:rgba(236,253,245,0.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 1px 2px 0 rgba(6,78,59,0.05)}
      :root[data-gt-shell] .gt-shell-nav__inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:12px 24px;box-sizing:border-box}
      :root[data-gt-shell] .gt-shell-nav__brand{flex-shrink:0;font-family:'Lora',Georgia,'Times New Roman',serif;font-weight:700;font-size:1.5rem;letter-spacing:-0.01em;color:#004532;text-decoration:none}
      :root[data-gt-shell] .gt-shell-nav__links{display:flex;align-items:center;gap:28px}
      :root[data-gt-shell] .gt-shell-nav__link{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;font-size:0.75rem;line-height:1;letter-spacing:0.05em;text-transform:uppercase;text-decoration:none;color:#3f4944;font-weight:500;padding-bottom:2px;border-bottom:2px solid transparent}
      :root[data-gt-shell] .gt-shell-nav__link--active{color:#004532;font-weight:700;border-bottom:2px solid #004532}
      :root[data-gt-shell] .gt-shell-nav__signin{flex-shrink:0;font-family:'Inter',ui-sans-serif,system-ui,sans-serif;font-size:0.75rem;line-height:1;letter-spacing:0.05em;text-transform:uppercase;font-weight:600;text-decoration:none;color:#004532;padding:6px 12px;border-radius:8px}
      :root[data-gt-shell] .gt-shell-nav__signin:hover{background:rgba(209,250,229,0.6)}
      :root[data-gt-shell] .gt-shell-nav__identity{display:flex;align-items:center;gap:10px;flex-shrink:0}
      :root[data-gt-shell] .gt-shell-nav__name{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;font-size:0.875rem;font-weight:500;color:#131b2e}
      :root[data-gt-shell] .gt-shell-nav__avatar{width:36px;height:36px;border-radius:9999px;display:grid;place-items:center;font-family:'Inter',ui-sans-serif,system-ui,sans-serif;font-size:0.75rem;font-weight:700;color:#fff;background:#004532}
      :root[data-gt-shell] .gt-shell-nav__logout{font-family:'Inter',ui-sans-serif,system-ui,sans-serif;font-size:0.75rem;line-height:1;letter-spacing:0.05em;text-transform:uppercase;font-weight:600;color:#3f4944;background:none;border:none;cursor:pointer;padding:6px 12px;border-radius:8px}
      :root[data-gt-shell] .gt-shell-nav__logout:hover{background:rgba(209,250,229,0.6)}
      @media (max-width:639px){:root[data-gt-shell] .gt-shell-nav__name{display:none}}
      @media (max-width:767px){:root[data-gt-shell] .gt-shell-nav__links{display:none}}
      :root[data-gt-shell] body{padding-top:56px}
    </style>
    <nav class="gt-shell-nav" aria-label="Good Thoughts sections">
      <div class="gt-shell-nav__inner">
        <a class="gt-shell-nav__brand" href="/">Good Thoughts</a>
        <div class="gt-shell-nav__links">
          <a class="gt-shell-nav__link" href="/">Finance</a>
          <a class="gt-shell-nav__link" href="/markets">Markets</a>
          <a class="gt-shell-nav__link" href="/ipo">IPO</a>
          <a class="gt-shell-nav__link" href="/blog">Blog</a>
          <a class="gt-shell-nav__link gt-shell-nav__link--active" href="/monitor" aria-current="page">Monitor</a>
        </div>
        <div class="gt-shell-nav__identity" id="gtIdentity">
          <a class="gt-shell-nav__signin" href="/auth">Sign in</a>
        </div>
      </div>
    </nav>
    <script src="/gt-identity.js"></script>
    <div id="app"></div>
    <script type="module" src="/src/live-channels-main.ts"></script>
  </body>
</html>
